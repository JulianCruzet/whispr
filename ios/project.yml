# Xcode project spec. After adding/removing Swift files run:  cd ios && xcodegen
name: Whispr
options:
  bundleIdPrefix: com.juliancruzet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: 88B25A43QT
targets:
  Whispr:
    type: application
    platform: iOS
    sources:
      - Whispr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juliancruzet.whispr
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Default backend for fresh installs; override with xcodebuild WHISPR_BACKEND_URL=wss://.../ws
        WHISPR_BACKEND_URL: ws://localhost:8787/ws
        # Project URL and publishable key from Supabase. Left empty, the app skips sign-in.
        # Never put the secret key here: anything in the app can be read out of it.
        SUPABASE_URL: https://txfoohqiwzxtzyzboidh.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_v9ulcF884Vjsn1p2XZ1LpA_8WIBuEj1
    info:
      path: Whispr/Info.plist
      properties:
        CFBundleDisplayName: Whispr
        WhisprBackendURL: $(WHISPR_BACKEND_URL)
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: Whispr listens to your conversation so it can whisper what to say next.
        NSPhotoLibraryAddUsageDescription: Whispr saves proof photos to your library.
        NSLocalNetworkUsageDescription: Whispr connects to the backend running on your laptop.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
