# Xcode project spec. After adding/removing Swift files run:  cd ios && xcodegen
name: Whispr
options:
  bundleIdPrefix: com.juliancruzet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: 88B25A43QT
targets:
  Whispr:
    type: application
    platform: iOS
    sources:
      - Whispr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juliancruzet.whispr
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Default backend for fresh installs; override with xcodebuild WHISPR_BACKEND_URL=wss://.../ws
        WHISPR_BACKEND_URL: ws://localhost:8787/ws
    info:
      path: Whispr/Info.plist
      properties:
        CFBundleDisplayName: Whispr
        WhisprBackendURL: $(WHISPR_BACKEND_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Whispr listens to your conversation so it can whisper what to say next.
        NSPhotoLibraryAddUsageDescription: Whispr saves proof photos to your library.
        NSLocalNetworkUsageDescription: Whispr connects to the backend running on your laptop.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
