# Two services: the brain (Python) and the audio gateway (Node) the phone connects to.
services:
  - type: web
    name: whispr-brain
    runtime: python
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: FALLBACK_PHOTO_URL
        sync: false
      - key: APP_SHARED_TOKEN
        sync: false

  - type: web
    name: whispr
    runtime: node
    region: virginia
    plan: free
    rootDir: backend
    # tsc is a dev dependency, so install it even when NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: APP_SHARED_TOKEN
        sync: false
      # The brain's public address, e.g. wss://whispr-brain.onrender.com/ws.
      # Not the private network: Free services can't receive private traffic.
      - key: BRAIN_URL
        sync: false
