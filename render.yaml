# Two services: the brain (Python) and the audio gateway (Node) the phone connects to.
services:
  - type: web
    name: whispr-brain
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: FALLBACK_PHOTO_URL
        sync: false
      - key: APP_SHARED_TOKEN
        sync: false

  - type: web
    name: whispr-gateway
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: APP_SHARED_TOKEN
        sync: false
      # The gateway reaches the brain over Render's private network.
      - key: BRAIN_HOSTPORT
        fromService:
          type: web
          name: whispr-brain
          property: hostport
